name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: thingso-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ThingsO production
    runs-on: self-hosted
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight VPS
        shell: bash
        run: |
          set -euo pipefail
          echo "user=$(whoami)"
          echo "host=$(hostname)"
          docker --version
          docker compose version
          git --version
          test "$(id -u)" -ne 0
          docker info >/dev/null

      - name: Prepare release and local production secrets
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/thingso-prod"
          RELEASE="$ROOT/releases/${GITHUB_SHA}"
          SHARED="$ROOT/shared"
          mkdir -p "$RELEASE" "$SHARED"
          git archive HEAD | tar -x -C "$RELEASE"

          ENV_FILE="$SHARED/.env.production"
          if [ ! -f "$ENV_FILE" ]; then
            POSTGRES_PASSWORD="$(openssl rand -hex 32)"
            ADMIN_AUTH_SECRET="$(openssl rand -hex 32)"
            cat > "$ENV_FILE" <<EOF
          POSTGRES_DB=thingso
          POSTGRES_USER=thingso
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          NEXT_PUBLIC_APP_URL=https://thingso.dev
          GITHUB_TOKEN=
          GITHUB_API_VERSION=2022-11-28
          AI_PROVIDER=openai-compatible
          AI_API_KEY=
          AI_BASE_URL=https://api.openai.com/v1
          AI_MODEL_ENRICH=
          AI_MODEL_REVIEW=
          WORKER_CONCURRENCY=1
          JOB_POLL_INTERVAL_SECONDS=5
          ADMIN_AUTH_SECRET=${ADMIN_AUTH_SECRET}
          ANALYTICS_WRITE_KEY=
          SENTRY_DSN=
          EOF
            chmod 600 "$ENV_FILE"
            echo "Created server-local production secrets at $ENV_FILE"
          else
            chmod 600 "$ENV_FILE"
            echo "Using existing server-local production secrets"
          fi

          ln -sfn "$RELEASE" "$ROOT/candidate"
          echo "THINGSO_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "THINGSO_RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "THINGSO_ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"

      - name: Build production images
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          docker compose -p thingso-prod \
            --env-file "$THINGSO_ENV_FILE" \
            -f deploy/compose.prod.yml \
            build

      - name: Start database, migrate, web, worker and proxy
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          docker compose -p thingso-prod \
            --env-file "$THINGSO_ENV_FILE" \
            -f deploy/compose.prod.yml \
            up -d --remove-orphans

      - name: Wait for services
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          for attempt in $(seq 1 30); do
            if docker compose -p thingso-prod \
              --env-file "$THINGSO_ENV_FILE" \
              -f deploy/compose.prod.yml \
              exec -T caddy wget -qO- http://web:3000/api/health >/tmp/thingso-health.json 2>/dev/null; then
              cat /tmp/thingso-health.json
              exit 0
            fi
            sleep 5
          done
          echo "Internal health check did not become ready"
          docker compose -p thingso-prod \
            --env-file "$THINGSO_ENV_FILE" \
            -f deploy/compose.prod.yml ps
          docker compose -p thingso-prod \
            --env-file "$THINGSO_ENV_FILE" \
            -f deploy/compose.prod.yml logs --tail=200
          exit 1

      - name: Verify production state
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          docker compose -p thingso-prod \
            --env-file "$THINGSO_ENV_FILE" \
            -f deploy/compose.prod.yml ps

          MIGRATE_STATUS="$(docker inspect -f '{{.State.ExitCode}}' thingso-prod-migrate-1 2>/dev/null || true)"
          if [ -n "$MIGRATE_STATUS" ] && [ "$MIGRATE_STATUS" != "0" ]; then
            echo "Migration container exit code: $MIGRATE_STATUS"
            exit 1
          fi

          ln -sfn "$THINGSO_RELEASE" "$THINGSO_ROOT/current"
          printf '%s\n' "$GITHUB_SHA" > "$THINGSO_ROOT/current-sha"

      - name: External HTTPS smoke test
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 \
            https://thingso.dev/api/health

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          if [ -n "${THINGSO_RELEASE:-}" ] && [ -d "$THINGSO_RELEASE" ]; then
            cd "$THINGSO_RELEASE"
            docker compose -p thingso-prod \
              --env-file "$THINGSO_ENV_FILE" \
              -f deploy/compose.prod.yml ps
            docker compose -p thingso-prod \
              --env-file "$THINGSO_ENV_FILE" \
              -f deploy/compose.prod.yml logs --tail=250
          fi

      - name: Keep recent releases
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_ROOT/releases"
          ls -1dt */ 2>/dev/null | tail -n +6 | xargs -r rm -rf
