name: Publish intelligence evidence-depth v1

on:
  workflow_run:
    workflows: ["Deploy production", "Refresh intelligence evidence"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: thingso-intelligence-evidence-depth-v1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  change-gate:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.gate.outputs.needed }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      trigger_name: ${{ steps.gate.outputs.trigger_name }}
    steps:
      - name: Decide whether evidence-depth publication is needed
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const manual = context.eventName === 'workflow_dispatch';
            const run = context.payload.workflow_run;
            const headSha = manual ? context.sha : run.head_sha;
            const triggerName = manual ? 'workflow_dispatch' : run.name;
            core.setOutput('head_sha', headSha);
            core.setOutput('trigger_name', triggerName);
            if (manual) {
              core.setOutput('needed', 'true');
              return;
            }
            if (run.conclusion !== 'success' || run.head_branch !== 'main') {
              core.setOutput('needed', 'false');
              return;
            }
            // Refresh can advance current_snapshot_id. Always verify/reconcile the
            // evidence-depth profile after a successful refresh, even if app code did not change.
            if (run.name === 'Refresh intelligence evidence') {
              core.setOutput('needed', 'true');
              return;
            }
            // A normal deploy only republishes when versioned intelligence inputs changed.
            // UI-only releases must not reprocess all curated repositories.
            const response = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
              per_page: 100,
            });
            const watched = [
              'apps/worker/src/thingso_worker/evidence_pack.py',
              'apps/worker/src/thingso_worker/quality_editorial.py',
              'apps/worker/src/thingso_worker/semantic_depth.py',
              'apps/worker/scripts/generate_quality_intelligence.py',
              'apps/worker/scripts/import_quality_intelligence.py',
              'packages/db/migrations/0005_evidence_pack_v3_document_types.sql',
              'data/seeds/repositories.csv',
              '.github/workflows/publish-intelligence-quality-v2.yml',
              '.github/workflows/refresh-intelligence-evidence.yml',
            ];
            const files = (response.data.files || []).map(file => file.filename);
            core.setOutput('needed', files.some(file => watched.includes(file)) ? 'true' : 'false');

  publish:
    needs: change-gate
    if: needs.change-gate.outputs.needed == 'true'
    runs-on: self-hosted
    timeout-minutes: 90
    environment: production

    steps:
      - name: Locate deployed production release
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/thingso-prod"
          RELEASE="$(readlink -f "$ROOT/current")"
          ENV_FILE="$ROOT/shared/.env.production"
          test -d "$RELEASE"
          test -f "$ENV_FILE"

          # Deploy-triggered publication must operate on the exact deployed release.
          # Refresh-triggered publication uses the release that the refresh itself just reconciled.
          if [ "${{ needs.change-gate.outputs.trigger_name }}" = "Deploy production" ]; then
            DEPLOYED_SHA="$(cat "$ROOT/current-sha")"
            EXPECTED_SHA="${{ needs.change-gate.outputs.head_sha }}"
            test "$DEPLOYED_SHA" = "$EXPECTED_SHA"
          fi

          echo "THINGSO_RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "THINGSO_ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"

      - name: Validate curated 100
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          docker compose -p thingso-prod \
            --env-file "$THINGSO_ENV_FILE" \
            -f deploy/compose.prod.yml \
            run --rm worker \
            sh -lc 'uv run --project apps/worker python -m thingso_worker seed-check data/seeds/repositories.csv'

      - name: Check current evidence-depth coverage
        id: coverage
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          read -r TOTAL APPROVED <<EOF
          $(docker compose -p thingso-prod \
            --env-file "$THINGSO_ENV_FILE" \
            -f deploy/compose.prod.yml \
            exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -AtF " " -c "SELECT (SELECT count(*) FROM repositories WHERE current_snapshot_id IS NOT NULL), (SELECT count(DISTINCT a.repository_id) FROM ai_analyses a JOIN repositories r ON r.id = a.repository_id WHERE a.analysis_type = '\''repository_intelligence'\'' AND a.schema_version = '\''repo-intelligence-v3'\'' AND a.model_provider = '\''editorial'\'' AND a.model_name = '\''evidence-depth-editorial-v1'\'' AND a.prompt_version = '\''manual-intelligence-v3-evidence-depth-v1'\'' AND a.review_status = '\''approved'\'' AND a.source_snapshot_id = r.current_snapshot_id);"')
          EOF
          echo "total=$TOTAL"
          echo "approved=$APPROVED"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "approved=$APPROVED" >> "$GITHUB_OUTPUT"

      - name: Generate and import evidence-depth profiles
        if: steps.coverage.outputs.approved != steps.coverage.outputs.total
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          docker compose -p thingso-prod \
            --env-file "$THINGSO_ENV_FILE" \
            -f deploy/compose.prod.yml \
            run --rm worker sh -lc '
              set -eu
              uv run --project apps/worker python apps/worker/scripts/generate_quality_intelligence.py \
                --seed data/seeds/repositories.csv \
                --output /tmp/editorial-evidence-depth-v1.json
              uv run --project apps/worker python apps/worker/scripts/import_quality_intelligence.py \
                /tmp/editorial-evidence-depth-v1.json
            '

      - name: Evidence-depth production gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          query_db() {
            docker compose -p thingso-prod \
              --env-file "$THINGSO_ENV_FILE" \
              -f deploy/compose.prod.yml \
              exec -T postgres sh -lc "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -Atc \"$1\""
          }
          TOTAL="$(query_db 'SELECT count(*) FROM repositories WHERE current_snapshot_id IS NOT NULL;')"
          APPROVED="$(query_db "SELECT count(DISTINCT a.repository_id) FROM ai_analyses a JOIN repositories r ON r.id = a.repository_id WHERE a.analysis_type = 'repository_intelligence' AND a.schema_version = 'repo-intelligence-v3' AND a.model_provider = 'editorial' AND a.model_name = 'evidence-depth-editorial-v1' AND a.prompt_version = 'manual-intelligence-v3-evidence-depth-v1' AND a.review_status = 'approved' AND a.source_snapshot_id = r.current_snapshot_id;")"
          REVIEW="$(query_db "SELECT count(*) FROM ai_analyses a JOIN repositories r ON r.id = a.repository_id WHERE a.model_name = 'evidence-depth-editorial-v1' AND a.prompt_version = 'manual-intelligence-v3-evidence-depth-v1' AND a.source_snapshot_id = r.current_snapshot_id AND a.review_status <> 'approved';")"
          echo "Current repositories: $TOTAL"
          echo "Approved evidence-depth profiles: $APPROVED"
          echo "Non-approved evidence-depth profiles: $REVIEW"
          {
            echo "## ThingsO Intelligence Evidence-depth v1"
            echo "- Current repositories: $TOTAL"
            echo "- Approved evidence-depth profiles: $APPROVED"
            echo "- Non-approved current evidence-depth profiles: $REVIEW"
            echo "- Refresh-triggered current-snapshot reconciliation: enabled"
            echo "- Deploy-triggered publication: version/change gated"
            echo "- Category-template semantic leakage gate: enabled"
            echo "- Semantic duplicate gate: enabled"
            echo "- Unknown/sparse sections: explicitly allowed"
            echo "- Overall confidence: evidence-coverage weighted"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$TOTAL" -ge 100
          test "$APPROVED" -eq "$TOTAL"
          test "$REVIEW" -eq 0

      - name: Production health check
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 https://thingso.dev/api/health
