name: Legacy publish repository intelligence v3

on:
  workflow_dispatch:

concurrency:
  group: thingso-repository-intelligence-v3-legacy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: self-hosted
    timeout-minutes: 60
    environment: production

    steps:
      - name: Locate production release
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/thingso-prod"
          ENV_FILE="$ROOT/shared/.env.production"
          RELEASE="$(readlink -f "$ROOT/current")"
          test -f "$ENV_FILE"
          test -d "$RELEASE"
          echo "THINGSO_RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "THINGSO_ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"

      - name: Legacy publication warning
        shell: bash
        run: |
          cat <<'EOF'
          This workflow is retained for manual rollback/audit only.
          It must not run automatically after evidence refresh because its manual-intelligence-v3-usecases-v1
          profiles can race with and supersede current evidence-depth publication by created_at ordering.
          EOF

      - name: Validate curated 100
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          docker compose -p thingso-prod \
            --env-file "$THINGSO_ENV_FILE" \
            -f deploy/compose.prod.yml \
            run --rm worker \
            sh -lc 'uv run --project apps/worker python -m thingso_worker seed-check data/seeds/repositories.csv'

      - name: Generate and publish legacy V3 intelligence
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          docker compose -p thingso-prod \
            --env-file "$THINGSO_ENV_FILE" \
            -f deploy/compose.prod.yml \
            run --rm worker sh -lc '
              set -eu
              uv run --project apps/worker python apps/worker/scripts/generate_editorial_baseline.py \
                --seed data/seeds/repositories.csv \
                --output /tmp/editorial-baseline-v3.json
              uv run --project apps/worker python apps/worker/scripts/import_manual_intelligence.py \
                /tmp/editorial-baseline-v3.json
            '

      - name: Legacy publication report
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          docker compose -p thingso-prod \
            --env-file "$THINGSO_ENV_FILE" \
            -f deploy/compose.prod.yml \
            exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(DISTINCT a.repository_id) FROM ai_analyses a JOIN repositories r ON r.id = a.repository_id WHERE a.analysis_type = '\''repository_intelligence'\'' AND a.schema_version = '\''repo-intelligence-v3'\'' AND a.model_provider = '\''editorial'\'' AND a.prompt_version = '\''manual-intelligence-v3-usecases-v1'\'' AND a.review_status = '\''approved'\'' AND a.source_snapshot_id = r.current_snapshot_id;"'

      - name: Production health check
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 https://thingso.dev/api/health
