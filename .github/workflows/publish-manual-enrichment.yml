name: Publish manual enrichment (legacy v1)

on:
  workflow_dispatch:

concurrency:
  group: thingso-manual-enrichment-v1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: self-hosted
    timeout-minutes: 15
    environment: production

    steps:
      - name: Resolve current production release
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/thingso-prod"
          RELEASE="$(readlink -f "$ROOT/current")"
          ENV_FILE="$ROOT/shared/.env.production"
          test -n "$RELEASE"
          test -d "$RELEASE"
          test -f "$ENV_FILE"
          echo "THINGSO_RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "THINGSO_ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"

      - name: Publish legacy editorial canary
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          docker compose -p thingso-prod \
            --env-file "$THINGSO_ENV_FILE" \
            -f deploy/compose.prod.yml \
            run --rm worker \
            uv run --project apps/worker python \
            apps/worker/scripts/import_manual_enrichment.py \
            data/manual-enrichment/canary-10.json | tee /tmp/manual-enrichment-v1.json

      - name: Verify legacy analyses
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          APPROVED="$(docker compose -p thingso-prod \
            --env-file "$THINGSO_ENV_FILE" \
            -f deploy/compose.prod.yml \
            exec -T postgres psql \
            -U thingso -d thingso -Atc \
            "SELECT count(*) FROM ai_analyses WHERE analysis_type='repository_enrichment' AND model_provider='editorial' AND review_status='approved';")"
          echo "Approved legacy editorial analyses: $APPROVED"
          test "$APPROVED" -ge 10

      - name: Production health check
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 https://thingso.dev/api/health
