name: Refresh intelligence evidence

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_run:
    workflows: ["Deploy production"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: thingso-intelligence-evidence
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  change-gate:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.gate.outputs.needed }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
    steps:
      - name: Decide whether refresh is needed
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const recurring = context.eventName === 'schedule' || context.eventName === 'workflow_dispatch';
            if (recurring) {
              core.setOutput('head_sha', context.sha);
              core.setOutput('needed', 'true');
              return;
            }

            const run = context.payload.workflow_run;
            core.setOutput('head_sha', run.head_sha);
            if (run.conclusion !== 'success' || run.head_branch !== 'main') {
              core.setOutput('needed', 'false');
              return;
            }

            const response = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: run.head_sha,
              per_page: 100,
            });
            const watched = [
              'apps/worker/src/thingso_worker/evidence_pack.py',
              'apps/worker/src/thingso_worker/quality_editorial.py',
              'apps/worker/src/thingso_worker/semantic_depth.py',
              'apps/worker/scripts/generate_quality_intelligence.py',
              'apps/worker/scripts/import_quality_intelligence.py',
              'data/seeds/repositories.csv',
              '.github/workflows/refresh-intelligence-evidence.yml',
              '.github/workflows/publish-intelligence-quality-v2.yml',
            ];
            const files = (response.data.files || []).map(file => file.filename);
            core.setOutput('needed', files.some(file => watched.includes(file)) ? 'true' : 'false');

  refresh:
    needs: change-gate
    if: needs.change-gate.outputs.needed == 'true'
    runs-on: self-hosted
    timeout-minutes: 120
    environment: production
    env:
      GH_RUNTIME_TOKEN: ${{ github.token }}

    steps:
      - name: Locate production release
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/thingso-prod"
          RELEASE="$(readlink -f "$ROOT/current")"
          ENV_FILE="$ROOT/shared/.env.production"
          test -d "$RELEASE"
          test -f "$ENV_FILE"

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            DEPLOYED_SHA="$(cat "$ROOT/current-sha")"
            EXPECTED_SHA="${{ needs.change-gate.outputs.head_sha }}"
            test "$DEPLOYED_SHA" = "$EXPECTED_SHA"
          fi

          echo "THINGSO_RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "THINGSO_ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"

      - name: Validate curated seed
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          docker compose -p thingso-prod \
            --env-file "$THINGSO_ENV_FILE" \
            -f deploy/compose.prod.yml \
            run --rm worker \
            sh -lc 'uv run --project apps/worker python -m thingso_worker seed-check data/seeds/repositories.csv'

      - name: Refresh Evidence Pack v3 for curated 100
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          export GITHUB_TOKEN="$GH_RUNTIME_TOKEN"
          docker compose -p thingso-prod \
            --env-file "$THINGSO_ENV_FILE" \
            -f deploy/compose.prod.yml \
            run --rm worker sh -lc '
              set -u
              total=0
              failed=0
              tail -n +2 data/seeds/repositories.csv > /tmp/thingso-repositories.csv
              while IFS=, read -r full_name category priority; do
                [ -n "$full_name" ] || continue
                total=$((total + 1))
                echo "[$total/100] refresh $full_name"

                attempt=1
                succeeded=0
                while [ "$attempt" -le 3 ]; do
                  if uv run --project apps/worker python -m thingso_worker ingest "$full_name"; then
                    succeeded=1
                    break
                  fi
                  echo "retry $attempt/3 for $full_name" >&2
                  sleep $((attempt * 15))
                  attempt=$((attempt + 1))
                done

                if [ "$succeeded" -ne 1 ]; then
                  echo "FAILED $full_name after 3 attempts" >&2
                  failed=$((failed + 1))
                fi
              done < /tmp/thingso-repositories.csv

              echo "Evidence refresh processed: $total"
              echo "Evidence refresh failures: $failed"
              test "$total" -eq 100
              test "$failed" -eq 0
            '

      - name: Evidence quality gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          query_db() {
            docker compose -p thingso-prod \
              --env-file "$THINGSO_ENV_FILE" \
              -f deploy/compose.prod.yml \
              exec -T postgres sh -lc "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -Atc \"$1\""
          }

          REPOS="$(query_db 'SELECT count(*) FROM repositories WHERE current_snapshot_id IS NOT NULL;')"
          README="$(query_db "SELECT count(DISTINCT repository_id) FROM source_documents WHERE document_type = 'readme';")"
          TREES="$(query_db "SELECT count(DISTINCT repository_id) FROM source_documents WHERE document_type = 'repository_tree';")"
          TECHNICAL="$(query_db "SELECT count(DISTINCT repository_id) FROM source_documents WHERE document_type IN ('manifest','container','configuration','contributing','security','architecture','ci','documentation','source_entrypoint','changelog');")"
          SOURCE_ENTRY="$(query_db "SELECT count(DISTINCT repository_id) FROM source_documents WHERE document_type = 'source_entrypoint';")"
          EVOLUTION="$(query_db "SELECT count(DISTINCT repository_id) FROM source_documents WHERE document_type = 'changelog';")"
          PACK3="$(query_db "SELECT count(*) FROM (SELECT repository_id FROM source_documents GROUP BY repository_id HAVING count(DISTINCT document_type) >= 3) q;")"
          DOCS="$(query_db 'SELECT count(*) FROM source_documents;')"

          echo "Repositories: $REPOS"
          echo "README coverage: $README"
          echo "Tree coverage: $TREES"
          echo "Technical evidence coverage: $TECHNICAL"
          echo "Source-entrypoint coverage: $SOURCE_ENTRY"
          echo "Evolution/changelog coverage: $EVOLUTION"
          echo "Repositories with >=3 evidence document types: $PACK3"
          echo "Total source documents: $DOCS"

          {
            echo "## ThingsO Evidence Pack v3"
            echo "- Repositories: $REPOS"
            echo "- README coverage: $README"
            echo "- Repository tree coverage: $TREES"
            echo "- Technical evidence coverage: $TECHNICAL"
            echo "- Source-entrypoint coverage: $SOURCE_ENTRY"
            echo "- Evolution/changelog coverage: $EVOLUTION"
            echo "- >=3 evidence types: $PACK3"
            echo "- Source documents: $DOCS"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$REPOS" -ge 100
          test "$README" -ge 100
          test "$TREES" -ge 100
          test "$TECHNICAL" -ge 100
          test "$PACK3" -ge 100

      - name: Production health check
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 https://thingso.dev/api/health
