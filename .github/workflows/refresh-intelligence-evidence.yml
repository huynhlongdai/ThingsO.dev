name: Refresh intelligence evidence

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: thingso-intelligence-evidence
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: self-hosted
    timeout-minutes: 120
    environment: production
    env:
      GH_RUNTIME_TOKEN: ${{ github.token }}

    steps:
      - name: Locate production release
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/thingso-prod"
          RELEASE="$(readlink -f "$ROOT/current")"
          ENV_FILE="$ROOT/shared/.env.production"
          test -d "$RELEASE"
          test -f "$ENV_FILE"
          echo "THINGSO_RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "THINGSO_ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"

      - name: Validate curated seed
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          docker compose -p thingso-prod \
            --env-file "$THINGSO_ENV_FILE" \
            -f deploy/compose.prod.yml \
            run --rm worker \
            sh -lc 'uv run --project apps/worker python -m thingso_worker seed-check data/seeds/repositories.csv'

      - name: Refresh Evidence Pack v3 and reconcile each current snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          export GITHUB_TOKEN="$GH_RUNTIME_TOKEN"
          docker compose -p thingso-prod \
            --env-file "$THINGSO_ENV_FILE" \
            -f deploy/compose.prod.yml \
            run --rm worker sh -lc '
              set -u
              total=0
              failed=0
              tail -n +2 data/seeds/repositories.csv > /tmp/thingso-repositories.csv
              while IFS=, read -r full_name category priority; do
                [ -n "$full_name" ] || continue
                total=$((total + 1))
                echo "[$total/100] refresh + reconcile $full_name"

                attempt=1
                succeeded=0
                while [ "$attempt" -le 3 ]; do
                  output="/tmp/thingso-depth-${total}.json"
                  if uv run --project apps/worker python -m thingso_worker ingest "$full_name" \
                    && uv run --project apps/worker python apps/worker/scripts/generate_quality_intelligence.py \
                      --repository "$full_name" \
                      --category "$category" \
                      --output "$output" \
                    && uv run --project apps/worker python apps/worker/scripts/import_quality_intelligence.py "$output"; then
                    succeeded=1
                    break
                  fi
                  echo "retry $attempt/3 for $full_name" >&2
                  sleep $((attempt * 15))
                  attempt=$((attempt + 1))
                done

                if [ "$succeeded" -ne 1 ]; then
                  echo "FAILED refresh/reconcile $full_name after 3 attempts" >&2
                  failed=$((failed + 1))
                fi
              done < /tmp/thingso-repositories.csv

              echo "Evidence refresh processed: $total"
              echo "Evidence refresh/reconcile failures: $failed"
              test "$total" -eq 100
              test "$failed" -eq 0
            '

      - name: Evidence and current-snapshot intelligence gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$THINGSO_RELEASE"
          query_db() {
            docker compose -p thingso-prod \
              --env-file "$THINGSO_ENV_FILE" \
              -f deploy/compose.prod.yml \
              exec -T postgres sh -lc "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -Atc \"$1\""
          }

          REPOS="$(query_db 'SELECT count(*) FROM repositories WHERE current_snapshot_id IS NOT NULL;')"
          README="$(query_db "SELECT count(DISTINCT repository_id) FROM source_documents WHERE document_type = 'readme';")"
          TREES="$(query_db "SELECT count(DISTINCT repository_id) FROM source_documents WHERE document_type = 'repository_tree';")"
          TECHNICAL="$(query_db "SELECT count(DISTINCT repository_id) FROM source_documents WHERE document_type IN ('manifest','container','configuration','contributing','security','architecture','ci','documentation','source_entrypoint','changelog');")"
          SOURCE_ENTRY="$(query_db "SELECT count(DISTINCT repository_id) FROM source_documents WHERE document_type = 'source_entrypoint';")"
          EVOLUTION="$(query_db "SELECT count(DISTINCT repository_id) FROM source_documents WHERE document_type = 'changelog';")"
          PACK3="$(query_db "SELECT count(*) FROM (SELECT repository_id FROM source_documents GROUP BY repository_id HAVING count(DISTINCT document_type) >= 3) q;")"
          DEPTH="$(query_db "SELECT count(DISTINCT a.repository_id) FROM ai_analyses a JOIN repositories r ON r.id = a.repository_id WHERE a.analysis_type = 'repository_intelligence' AND a.schema_version = 'repo-intelligence-v3' AND a.model_provider = 'editorial' AND a.model_name = 'evidence-depth-editorial-v1' AND a.prompt_version = 'manual-intelligence-v3-evidence-depth-v1' AND a.review_status = 'approved' AND a.source_snapshot_id = r.current_snapshot_id;")"
          REVIEW="$(query_db "SELECT count(*) FROM ai_analyses a JOIN repositories r ON r.id = a.repository_id WHERE a.model_name = 'evidence-depth-editorial-v1' AND a.prompt_version = 'manual-intelligence-v3-evidence-depth-v1' AND a.source_snapshot_id = r.current_snapshot_id AND a.review_status <> 'approved';")"
          DOCS="$(query_db 'SELECT count(*) FROM source_documents;')"

          echo "Repositories: $REPOS"
          echo "README coverage: $README"
          echo "Tree coverage: $TREES"
          echo "Technical evidence coverage: $TECHNICAL"
          echo "Source-entrypoint coverage: $SOURCE_ENTRY"
          echo "Evolution/changelog coverage: $EVOLUTION"
          echo "Repositories with >=3 evidence document types: $PACK3"
          echo "Current-snapshot evidence-depth profiles: $DEPTH"
          echo "Non-approved current evidence-depth profiles: $REVIEW"
          echo "Total source documents: $DOCS"

          {
            echo "## ThingsO Evidence Pack v3"
            echo "- Repositories: $REPOS"
            echo "- README coverage: $README"
            echo "- Repository tree coverage: $TREES"
            echo "- Technical evidence coverage: $TECHNICAL"
            echo "- Source-entrypoint coverage: $SOURCE_ENTRY"
            echo "- Evolution/changelog coverage: $EVOLUTION"
            echo "- >=3 evidence types: $PACK3"
            echo "- Current-snapshot evidence-depth profiles: $DEPTH"
            echo "- Non-approved current evidence-depth profiles: $REVIEW"
            echo "- Source documents: $DOCS"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$REPOS" -ge 100
          test "$README" -ge 100
          test "$TREES" -ge 100
          test "$TECHNICAL" -ge 100
          test "$PACK3" -ge 100
          test "$DEPTH" -eq "$REPOS"
          test "$REVIEW" -eq 0

      - name: Production health check
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 https://thingso.dev/api/health
