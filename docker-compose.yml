services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: thingso
      POSTGRES_PASSWORD: thingso
      POSTGRES_DB: thingso
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thingso -d thingso"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - thingso_postgres:/var/lib/postgresql/data

volumes:
  thingso_postgres:
